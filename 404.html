<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Simeon Portfolio</title>
  <link rel="shortcut icon" href="assets/images/favicon.jpg" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-theme-preload');
    }
  </script>
  <style>
    html.dark-theme-preload body { background-color: #121212; color: #f0f0f0; }
    .not-found-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      text-align: center;
    }
    .not-found-container {
      max-width: 560px;
      width: 100%;
    }
    .not-found-code {
      font-size: 7rem;
      font-weight: 700;
      color: var(--hover-orange);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .not-found-container h2 {
      font-size: 1.5rem;
      color: var(--text-color-second);
      margin-bottom: 1rem;
    }
    .not-found-container p {
      font-size: 1rem;
      color: var(--text-color-muted);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  </script>
  <div class="not-found-page">
    <div class="not-found-container">
      <p class="not-found-code">404</p>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn">Back to Homepage</a>
    </div>
  </div>
</body>
</html>
